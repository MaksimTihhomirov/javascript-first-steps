<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Background Selector</title>
</head>
<body>

  <h1>Background Color Selector</h1>

  <div>
    <input type="color" id="colorSelector">
  </div>

  <div>
    <button id="getRandomColor">Random BG Color</button>
  </div>

  <script>
    const colorSelector = document.querySelector('#colorSelector');
    const getRandomColor = document.querySelector('#getRandomColor');

    function getRandomRgbValue() {
      return Math.floor(Math.random() * 256);
    }

    colorSelector.addEventListener('input', event => {
      document.body.style.backgroundColor = event.target.value;
    });

    getRandomColor.addEventListener('click', () => {

      const red = getRandomRgbValue();
      const green = getRandomRgbValue();
      const blue = getRandomRgbValue();

      const rgb = `rgb(${red}, ${green}, ${blue})`;

      document.body.style.backgroundColor = rgb;

    });
  </script>

</body>
</html>
