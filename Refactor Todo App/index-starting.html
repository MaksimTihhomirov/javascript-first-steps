<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>

  <link rel="stylesheet" href="./reset.css" />
  <link rel="stylesheet" href="./todo-app.css" />
</head>
<body>

  <div class="todo-app-container">
    <div class="todo-app">
      <h2>Todo App</h2>

      <form action="#">
        <input
          type="text"
          class="todo-input"
          placeholder="What do you need to do?"
        />
      </form>

      <ul class="todo-list">
        <li class="todo-item">
          <input type="checkbox" />
          <span>Finish JavaScript Series</span>
          <button class="x-button">×</button>
        </li>
      </ul>

      <p class="items-remaining">1 item remaining</p>
    </div>
  </div>

</body>
</html>
